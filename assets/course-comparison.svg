<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Look beyond the points</title><desc id="desc">Compare course modules, entry requirements and everyday life.</desc><rect width="1200" height="600" rx="28" fill="#f3f0e9"/><g font-family="Arial,sans-serif" fill="#292c35"><text x="70" y="86" font-size="20" letter-spacing="3" fill="#676075">CAO FINDER · YOUR NEXT STEP</text><text x="70" y="150" font-size="46" font-weight="700">Same subject. What’s different?</text><g transform="translate(70 200)"><rect width="330" height="300" rx="20" fill="#e4ddf8"/><text x="28" y="60" font-size="18" fill="#6b579d">01 / THE WORK</text><text x="28" y="112" font-size="31" font-weight="700">Modules</text><text x="28" y="162" font-size="20">What will I learn?</text><path d="M28 198H280M28 228H246M28 258H266" stroke="#baa9de" stroke-width="8" stroke-linecap="round"/></g><g transform="translate(435 200)"><rect width="330" height="300" rx="20" fill="#dae7ec"/><text x="28" y="60" font-size="18" fill="#456c7b">02 / THE ENTRY</text><text x="28" y="112" font-size="31" font-weight="700">Requirements</text><text x="28" y="162" font-size="20">What must I check?</text><path d="M28 198H280M28 228H246M28 258H266" stroke="#a7c5d2" stroke-width="8" stroke-linecap="round"/></g><g transform="translate(800 200)"><rect width="330" height="300" rx="20" fill="#e7eacb"/><text x="28" y="60" font-size="18" fill="#657044">03 / THE WEEK</text><text x="28" y="112" font-size="31" font-weight="700">Everyday life</text><text x="28" y="162" font-size="20">Can I picture it?</text><path d="M28 198H280M28 228H246M28 258H266" stroke="#bec58e" stroke-width="8" stroke-linecap="round"/></g><text x="70" y="550" font-size="20" fill="#676075">A clear shortlist starts with better questions.</text></g></svg>